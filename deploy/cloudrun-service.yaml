apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: contestops-ai-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: us-docker.pkg.dev/PROJECT_ID/contestops/contestops-ai-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
